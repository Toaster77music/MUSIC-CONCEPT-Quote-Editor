name: Test and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: |
          mkdir public
          cp index.html style.css boot.js app.js core.js catalog.js quote.js builder.js public/
          python3 - <<'PYDEPLOY'
          import os, pathlib, re, json
          version = os.environ['GITHUB_SHA']
          for path in pathlib.Path('public').glob('*'):
              if path.suffix in ('.html', '.js'):
                  path.write_text(re.sub(r'([?&]v=)[A-Za-z0-9_-]+', lambda m: m[1]+version, path.read_text()))
          pathlib.Path('public/version.json').write_text(json.dumps({'version': version}))
          PYDEPLOY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
